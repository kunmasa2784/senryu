        id: 12,
        poem: "ワイワイの中 補聴器が 拾う声",
        author: "春栄",
        category: "仲間・会話",
        interpretation:
          "周囲がワイワイと賑やかに語り合う輪の中で、補聴器を通して相手の声を拾い上げている、シニア世代のリアルで味わい深い日常を切り取っています。",
        evaluation:
          "使われている言葉や着眼点は非常に良いものの、上五「ワイワイの中」・中七「補聴器が」の音数と区切りがややギクシャクして聞こえる点が指摘されました。",
        revision:
          "語順を入れ替えて「補聴器は ワイワイの中 声拾う」のように組み立て直すと、5・7・5のリズムがすっきり整います。"
      }
    ];

    const STORAGE_KEY = "senryu_waiwai_favorites_v1";
    let favorites = new Set();
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) favorites = new Set(parsed);
      }
    } catch (e) {
      // Ignore storage errors in restricted environments
    }

    let currentFilter = "all";
    let searchQuery = "";
    let activeModalId = null;
    let isLargeText = false;
    let expandedIds = new Set();

    const gridEl = document.getElementById("senryuGrid");
    const emptyStateEl = document.getElementById("emptyState");
    const resultSummaryEl = document.getElementById("resultSummary");
    const resetFiltersBtn = document.getElementById("resetFiltersBtn");
    const emptyResetBtn = document.getElementById("emptyResetBtn");
    const countAllEl = document.getElementById("countAll");
    const countFavEl = document.getElementById("countFav");
    const searchInputEl = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const toggleAllCardsBtn = document.getElementById("toggleAllCardsBtn");
    const toggleAllCardsLabel = document.getElementById("toggleAllCardsLabel");
    const fontSizeToggle = document.getElementById("fontSizeToggle");
    const fontSizeLabel = document.getElementById("fontSizeLabel");
    const printBtn = document.getElementById("printBtn");

    // Modal elements
    const detailModal = document.getElementById("detailModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalNumber = document.getElementById("modalNumber");
    const modalCategory = document.getElementById("modalCategory");
    const modalPoemTitle = document.getElementById("modalPoemTitle");
    const modalAuthor = document.getElementById("modalAuthor");
    const modalInterpretation = document.getElementById("modalInterpretation");
    const modalEvaluation = document.getElementById("modalEvaluation");
    const modalRevisionBox = document.getElementById("modalRevisionBox");
    const modalRevision = document.getElementById("modalRevision");
    const modalFavBtn = document.getElementById("modalFavBtn");
    const modalCopyBtn = document.getElementById("modalCopyBtn");
    const modalPrevBtn = document.getElementById("modalPrevBtn");
    const modalNextBtn = document.getElementById("modalNextBtn");
    const toastEl = document.getElementById("toast");

    let toastTimer = null;

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.remove("hidden");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.add("hidden");
      }, 2200);
    }

    function saveFavorites() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(favorites)));
      } catch (e) {
        // Ignore storage errors
      }
    }

    function toggleFavorite(id) {
      if (favorites.has(id)) {
        favorites.delete(id);
      } else {
        favorites.add(id);
      }
      saveFavorites();
      render();
      if (activeModalId === id) {
        updateModalFavButton(id);
      }
    }

    function getFilteredData() {
      const q = searchQuery.trim().toLowerCase();
      return senryuData.filter((item) => {
        if (currentFilter === "favorites" && !favorites.has(item.id)) return false;
        if (currentFilter !== "all" && currentFilter !== "favorites" && item.category !== currentFilter) {
          return false;
        }
        if (q) {
          const hay = `${item.poem} ${item.author} ${item.category} ${item.interpretation} ${item.evaluation} ${item.revision || ""}`.toLowerCase();
          return hay.includes(q);
        }
        return true;
      });
    }

    function categoryBadgeClass(category) {
      if (category === "仲間・会話") return "bg-sky-50 text-sky-800 border-sky-200";
      if (category === "季節・行事") return "bg-emerald-50 text-emerald-800 border-emerald-200";
      return "bg-purple-50 text-purple-800 border-purple-200";
    }

    function render() {
      countAllEl.textContent = String(senryuData.length);
      countFavEl.textContent = String(favorites.size);

      const filtered = getFilteredData();
      gridEl.innerHTML = "";

      const isFiltered = currentFilter !== "all" || searchQuery.trim() !== "";
      resetFiltersBtn.classList.toggle("hidden", !isFiltered);

      if (filtered.length === 0) {
        emptyStateEl.classList.remove("hidden");
        resultSummaryEl.textContent = "0句が該当しました";
        return;
      }

      emptyStateEl.classList.add("hidden");
      resultSummaryEl.textContent = isFiltered
        ? `${filtered.length}句を表示しています（全${senryuData.length}句中）`
        : `全${senryuData.length}句を表示しています（カードをクリックすると拡大表示されます）`;

      const allExpanded = filtered.length > 0 && filtered.every((item) => expandedIds.has(item.id));
      toggleAllCardsLabel.textContent = allExpanded ? "すべて閉じる" : "すべて開く";
      toggleAllCardsBtn.setAttribute("aria-pressed", String(allExpanded));

      filtered.forEach((item) => {
        const isFav = favorites.has(item.id);
        const isExpanded = expandedIds.has(item.id);
        const card = document.createElement("article");
        card.className =
          "senryu-card bg-white rounded-xl border border-stone-200 shadow-xs flex flex-col overflow-hidden cursor-pointer";
        card.setAttribute("tabindex", "0");
        card.setAttribute("role", "button");
        card.setAttribute("aria-expanded", String(isExpanded));
        card.setAttribute("aria-label", `${item.poem} 詠み人 ${item.author} の解釈・評価を${isExpanded ? "閉じる" : "開く"}`);

        const numStr = String(item.id).padStart(2, "0");
        const revisionHtml = item.revision
          ? `
            <div class="bg-sky-50/75 rounded-lg border border-sky-200/70 p-3">
              <h3 class="text-xs font-bold text-sky-900 flex items-center gap-1.5 mb-1">
                <span class="w-1.5 h-1.5 rounded-full bg-sky-600"></span>
                推敲ヒント
              </h3>
              <p class="body-copy text-xs sm:text-[13px] text-stone-800 leading-relaxed">
                ${item.revision}
              </p>
            </div>
          `
          : "";

        card.innerHTML = `
          <!-- Card Top Bar -->
          <div class="px-3.5 pt-2.5 pb-2 flex items-center justify-between gap-2 border-b border-stone-100 bg-stone-50/70">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-xs font-bold text-slate-500 tracking-wider">No.${numStr}</span>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full border truncate ${categoryBadgeClass(item.category)}">
                ${item.category}
              </span>
            </div>
            <button
              type="button"
              class="fav-btn no-print shrink-0 p-1 rounded-full transition ${
                isFav ? "text-amber-500 hover:bg-amber-50" : "text-stone-300 hover:text-amber-400 hover:bg-stone-100"
              }"
              data-id="${item.id}"
              aria-label="${isFav ? "選句から外す" : "選句に追加"}"
              aria-pressed="${isFav}"
              title="${isFav ? "選句から外す" : "選句に追加"}"
            >
              <svg class="w-5 h-5" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
              </svg>
            </button>
          </div>

          <!-- Poem & Author (Always Visible) -->
          <div class="px-4 pt-3.5 pb-3 bg-gradient-to-b from-[#fffdf9] to-white">
            <h2 class="poem-text font-serif-jp text-[1.1rem] font-bold text-slate-900 leading-relaxed tracking-wide">
              ${item.poem}
            </h2>
            <div class="mt-2.5 flex items-center justify-between gap-2">
              <span class="text-[11px] text-stone-500 no-print inline-flex items-center gap-1">
                <span>${isExpanded ? "▲ 閉じる" : "▼ 解釈・評価を見る"}</span>
              </span>
              <span class="hanko-badge inline-flex items-center px-2.5 py-0.5 rounded text-xs font-serif-jp font-semibold">
                詠み人：${item.author}
              </span>
            </div>
          </div>

          <!-- Collapsible Details -->
          <div class="${isExpanded ? "flex" : "hidden"} p-4 pt-3 border-t border-stone-100 flex-col gap-3 bg-white">
            <div>
              <h3 class="text-xs font-bold text-[#243b53] flex items-center gap-1.5 mb-1">
                <span class="w-1.5 h-1.5 rounded-full bg-[#243b53]"></span>
                解釈・背景
              </h3>
              <p class="body-copy text-xs sm:text-[13.5px] text-stone-700 leading-relaxed">
                ${item.interpretation}
              </p>
            </div>

            <div class="bg-amber-50/75 rounded-lg border border-amber-200/70 p-3">
              <h3 class="text-xs font-bold text-amber-900 flex items-center gap-1.5 mb-1">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-600"></span>
                評価のポイント
              </h3>
              <p class="body-copy text-xs sm:text-[13.5px] text-stone-800 leading-relaxed">
                ${item.evaluation}
              </p>
            </div>

            ${revisionHtml}

            <div class="pt-1 flex justify-end no-print">
              <button
                type="button"
                class="modal-open-btn text-xs font-medium text-[#243b53] hover:text-slate-900 hover:underline px-2 py-1 rounded"
              >
                大きな画面で見る ↗
              </button>
            </div>
          </div>
        `;

        card.addEventListener("click", (e) => {
          if (e.target.closest(".fav-btn") || e.target.closest(".modal-open-btn")) return;
          if (expandedIds.has(item.id)) {
            expandedIds.delete(item.id);
          } else {
            expandedIds.add(item.id);
          }
          render();
        });

        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            if (e.target.closest(".fav-btn") || e.target.closest(".modal-open-btn")) return;
            e.preventDefault();
            if (expandedIds.has(item.id)) {
              expandedIds.delete(item.id);
            } else {
              expandedIds.add(item.id);
            }
            render();
          }
        });

        const favBtn = card.querySelector(".fav-btn");
        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(item.id);
        });

        const modalOpenBtn = card.querySelector(".modal-open-btn");
        if (modalOpenBtn) {
          modalOpenBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openModal(item.id);
          });
        }

        gridEl.appendChild(card);
      });
    }

    function updateModalFavButton(id) {
      const isFav = favorites.has(id);
      if (isFav) {
        modalFavBtn.textContent = "★ 選句済み";
        modalFavBtn.className =
          "px-3.5 py-2 rounded-lg border border-amber-300 bg-amber-100 text-amber-900 text-sm font-semibold transition hover:bg-amber-200";
      } else {
        modalFavBtn.textContent = "☆ 選句に追加";
        modalFavBtn.className =
          "px-3.5 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium transition hover:bg-stone-50";
      }
    }

    function openModal(id) {
      const item = senryuData.find((d) => d.id === id);
      if (!item) return;
      activeModalId = id;

      modalNumber.textContent = `No. ${String(item.id).padStart(2, "0")}`;
      modalCategory.textContent = item.category;
      modalPoemTitle.textContent = item.poem;
      modalAuthor.textContent = `詠み人：${item.author}`;
      modalInterpretation.textContent = item.interpretation;
      modalEvaluation.textContent = item.evaluation;

      if (item.revision) {
        modalRevision.textContent = item.revision;
        modalRevisionBox.classList.remove("hidden");
      } else {
        modalRevision.textContent = "";
        modalRevisionBox.classList.add("hidden");
      }

      updateModalFavButton(id);

      detailModal.classList.remove("hidden");
      detailModal.classList.add("flex");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      activeModalId = null;
      detailModal.classList.add("hidden");
      detailModal.classList.remove("flex");
      document.body.style.overflow = "";
    }

    function navigateModal(delta) {
      if (activeModalId === null) return;
      const list = getFilteredData();
      if (list.length === 0) return;
      const idx = list.findIndex((d) => d.id === activeModalId);
      const nextIdx = idx === -1 ? 0 : (idx + delta + list.length) % list.length;
      openModal(list[nextIdx].id);
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(text)
          .then(() => showToast("句と詠み人をコピーしました"))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("句と詠み人をコピーしました");
      } catch (e) {
        showToast("コピーできませんでした");
      }
      document.body.removeChild(ta);
    }

    // Event Listeners
    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.filter;
        filterButtons.forEach((b) => {
          const active = b.dataset.filter === currentFilter;
          if (b.dataset.filter === "favorites") {
            b.className = active
              ? "filter-btn px-3.5 py-1.5 rounded-full text-sm font-semibold transition bg-amber-500 text-white shadow-xs"
              : "filter-btn px-3.5 py-1.5 rounded-full text-sm font-medium transition bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100";
          } else {
            b.className = active
              ? "filter-btn px-3.5 py-1.5 rounded-full text-sm font-medium transition bg-[#243b53] text-white"
              : "filter-btn px-3.5 py-1.5 rounded-full text-sm font-medium transition bg-stone-100 text-stone-700 hover:bg-stone-200";
          }
        });
        render();
      });
    });

    searchInputEl.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    function resetAllFilters() {
      currentFilter = "all";
      searchQuery = "";
      searchInputEl.value = "";
      filterButtons.forEach((b) => {
        if (b.dataset.filter === "all") {
          b.className = "filter-btn px-3.5 py-1.5 rounded-full text-sm font-medium transition bg-[#243b53] text-white";
        } else if (b.dataset.filter === "favorites") {
          b.className = "filter-btn px-3.5 py-1.5 rounded-full text-sm font-medium transition bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100";
        } else {
          b.className = "filter-btn px-3.5 py-1.5 rounded-full text-sm font-medium transition bg-stone-100 text-stone-700 hover:bg-stone-200";
        }
      });
      render();
    }

    resetFiltersBtn.addEventListener("click", resetAllFilters);
    emptyResetBtn.addEventListener("click", resetAllFilters);

    toggleAllCardsBtn.addEventListener("click", () => {
      const filtered = getFilteredData();
      const allExpanded = filtered.length > 0 && filtered.every((item) => expandedIds.has(item.id));
      if (allExpanded) {
        filtered.forEach((item) => expandedIds.delete(item.id));
      } else {
        filtered.forEach((item) => expandedIds.add(item.id));
      }
      render();
    });

    fontSizeToggle.addEventListener("click", () => {
      isLargeText = !isLargeText;
      document.body.classList.toggle("large-text", isLargeText);
      fontSizeToggle.setAttribute("aria-pressed", String(isLargeText));
      fontSizeLabel.textContent = isLargeText ? "文字サイズ：大きめ" : "文字サイズ：標準";
    });

    printBtn.addEventListener("click", () => {
      window.print();
    });

    closeModalBtn.addEventListener("click", closeModal);
    detailModal.addEventListener("click", (e) => {
      if (e.target === detailModal) closeModal();
    });

    modalFavBtn.addEventListener("click", () => {
      if (activeModalId !== null) toggleFavorite(activeModalId);
    });

    modalCopyBtn.addEventListener("click", () => {
      const item = senryuData.find((d) => d.id === activeModalId);
      if (item) {
        copyText(`「${item.poem}」（詠み人：${item.author}）`);
      }
    });

    modalPrevBtn.addEventListener("click", () => navigateModal(-1));
    modalNextBtn.addEventListener("click", () => navigateModal(1));

    document.addEventListener("keydown", (e) => {
      if (activeModalId === null) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft") navigateModal(-1);
      if (e.key === "ArrowRight") navigateModal(1);
    });

    render();
  </script>
</body>
</html>
